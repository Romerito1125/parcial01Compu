apiVersion: apps/v1
kind: Deployment
metadata:
  name: products
  namespace: microapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: products
  template:
    metadata:
      labels:
        app: products
    spec:
      containers:
        - name: products
          image: romerito1025/parcial-products:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5003
          env:
            - name: MYSQL_HOST
              value: products-db
            - name: MYSQL_USER
              value: root
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: PRODUCTS_DB_ROOT_PASSWORD
            - name: MYSQL_DB
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: PRODUCTS_DB_NAME
            - name: CONSUL_HOST
              value: consul-server
            - name: CONSUL_PORT
              value: "8500"

---
apiVersion: v1
kind: Service
metadata:
  name: products
  namespace: microapp
spec:
  type: ClusterIP
  selector:
    app: products
  ports:
    - port: 5003
      targetPort: 5003
