apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: microapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: romerito1025/parcial-orders:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5004
          env:
            - name: MYSQL_HOST
              value: orders-db
            - name: MYSQL_USER
              value: root
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: ORDERS_DB_ROOT_PASSWORD
            - name: MYSQL_DB
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: ORDERS_DB_NAME
            - name: CONSUL_HOST
              value: consul-server
            - name: CONSUL_PORT
              value: "8500"

---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: microapp
spec:
  type: ClusterIP
  selector:
    app: orders
  ports:
    - port: 5004
      targetPort: 5004
