apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  namespace: microapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      containers:
        - name: users
          image: romerito1025/parcial-users:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5002
          env:
            - name: MYSQL_HOST
              value: users-db
            - name: MYSQL_USER
              value: root
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: USERS_DB_ROOT_PASSWORD
            - name: MYSQL_DB
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: USERS_DB_NAME
            - name: CONSUL_HOST
              value: consul-server
            - name: CONSUL_PORT
              value: "8500"

---
apiVersion: v1
kind: Service
metadata:
  name: users
  namespace: microapp
spec:
  type: ClusterIP
  selector:
    app: users
  ports:
    - port: 5002
      targetPort: 5002
