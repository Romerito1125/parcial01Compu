<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Management</title>

    <link
        rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    >

    <style>
        body {
            padding-top: 70px;
            padding-bottom: 20px;
        }

        .navbar {
            margin-bottom: 20px;
        }

        .form-container {
            max-width: 500px;
            margin: 0 auto;
        }

        .orders-container {
            max-width: 1100px;
            margin: 0 auto;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">

    <a class="navbar-brand" href="/orders.html">
        Store Management
    </a>

    <button
        class="navbar-toggler"
        type="button"
        data-toggle="collapse"
        data-target="#navbarCollapse"
        aria-controls="navbarCollapse"
        aria-expanded="false"
        aria-label="Toggle navigation"
    >
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarCollapse">
        <ul class="navbar-nav ml-auto">
            <li class="nav-item">
                <button
                    type="button"
                    class="btn btn-outline-light"
                    onclick="logout()"
                >
                    Logout
                </button>
            </li>
        </ul>
    </div>

</nav>

<h2 class="mt-5">Products List</h2>

    <table id="product-list" class="table table-striped">

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
                <th>Stock</th>
            </tr>
        </thead>

        <tbody></tbody>

    </table>

    <button
        type="button"
        class="btn btn-secondary"
        onclick="getProductForOrder()">
        Get Products
    </button>

</div>


<div class="container orders-container">

    <!-- Información del usuario -->
    <div class="mb-4">
        <h2>
            Welcome, <span id="current-user"></span>
        </h2>
    </div>


    <!-- Crear orden -->
    <div class="card mb-5">

        <div class="card-header">
            <h3 class="mb-0">Place Order</h3>
        </div>

        <div class="card-body">

            <form id="add-order-form">

                <div class="form-group">
                    <label for="product-id">
                        Product ID
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="product-id"
                        min="1"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="quantity">
                        Quantity
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="quantity"
                        min="1"
                        required
                    >
                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Create Order
                </button>

            </form>

        </div>

    </div>


    <!-- Mis órdenes -->
    <div>

        <div class="d-flex justify-content-between align-items-center mb-3">

            <h3 class="mb-0">
                My Orders
            </h3>

            <button
                type="button"
                class="btn btn-secondary"
                onclick="getOrders()"
            >
                Refresh Orders
            </button>

        </div>


        <div class="table-responsive">

            <table
                id="order-list"
                class="table table-striped table-bordered"
            >

                <thead class="thead-dark">

                    <tr>
                        <th>Order ID</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Created At</th>
                        <th>Items</th>
                    </tr>

                </thead>

                <tbody>
                    <!-- Las órdenes se cargan mediante JavaScript -->
                </tbody>

            </table>

        </div>

    </div>

</div>


<script src="/static/scriptOrders.js"></script>
<script src="/static/scriptProducts.js"></script>

</body>
</html>
