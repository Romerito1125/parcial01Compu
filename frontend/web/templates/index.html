<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Store</title>

    <link
        rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    >

    <style>
        body {
            padding-top: 50px;
            padding-bottom: 20px;
        }

        .navbar {
            margin-bottom: 20px;
        }

        .form-container {
            max-width: 500px;
            margin: 80px auto;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">

    <span class="navbar-brand">
        Mini Store
    </span>

</nav>


<div class="container">

    <div class="form-container">

        <h2>Login</h2>

        <form id="login-form">

            <div class="form-group">

                <label for="login-username">
                    Username
                </label>

                <input
                    id="login-username"
                    type="text"
                    class="form-control"
                    required
                >

            </div>


            <div class="form-group">

                <label for="login-password">
                    Password
                </label>

                <input
                    id="login-password"
                    type="password"
                    class="form-control"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary"
            >
                Iniciar sesión
            </button>

        </form>


        <p id="login-message" class="mt-3"></p>

    </div>

</div>


<!-- JavaScript del Login -->
<script src="/static/scriptLogin.js"></script>

</body>
</html>
